# The stack is toggled via COMPOSE_PROFILES in .env (see .env.example):
#   full    = analyzer (mic) + sync (backup) + dashboard
#   (unset) = dashboard only — view-only machine displaying copied logs
services:
  analyzer:
    build:
      context: .
      dockerfile: analysis/Dockerfile
    container_name: noise-analyzer
    restart: unless-stopped
    profiles:
      - full
    devices:
      - "/dev/snd:/dev/snd"
    group_add:
      - audio
    environment:
      SOURCE: ${SOURCE:-alsa}
      ALSA_DEVICE: ${ALSA_DEVICE:-default}
      LOG_DIR: /data/logs
      EVENT_THRESHOLD: ${EVENT_THRESHOLD:-0.3}
      EVENT_REFRACTORY: ${EVENT_REFRACTORY:-10}
      EPISODE_REFRACTORY: ${EPISODE_REFRACTORY:-10}
      EVENT_BLOCKLIST: ${EVENT_BLOCKLIST:-}
      SPL_INTERVAL: ${SPL_INTERVAL:-1}
    volumes:
      - ./logs:/data/logs

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: noise-dashboard
    restart: unless-stopped
    environment:
      LOG_DIR: /data/logs
      DB_PATH: /data/logs/dashboard.db
      INGEST_INTERVAL: ${DASH_INGEST_INTERVAL:-2}
      EVENT_BLOCKLIST: ${EVENT_BLOCKLIST:-}
      EPISODE_REFRACTORY: ${EPISODE_REFRACTORY:-10}
      WEEKDAY_RECALC: ${WEEKDAY_RECALC:-300}
      TZ: ${TZ:-UTC}
    volumes:
      - ./logs:/data/logs
      - ./dashboard/static:/app/static:ro  # live UI edits, no rebuild needed
      - ./.rclone:/backup-state:ro         # last-backup marker written by sync
    ports:
      - "127.0.0.1:8080:8080"

  sync:
    image: rclone/rclone:latest
    container_name: noise-sync
    restart: unless-stopped
    profiles:
      - full
    tmpfs:
      - /tmp:size=256m
    volumes:
      - ./logs:/data/logs:ro
      - ./.rclone:/config/rclone
    entrypoint: >
      sh -c 'while true; do
        mkdir -p /tmp/push;
        cp /data/logs/events.jsonl /data/logs/spl.jsonl /tmp/push/ 2>/dev/null;
        rclone copy /tmp/push r2:noise-logs && date +%s > /config/rclone/last-backup;
        sleep 3600;
      done'
